name: golden_party_app
description: "GRAND ONE - ALL IN ONE"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ═══ الأساسيات ═══
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  flutter_localizations:
    sdk: flutter

  # ═══ الواجهات والتحميل ═══
  flutter_spinkit: ^5.2.2
  easy_localization: ^3.0.8

  # ═══ الشبكة والاتصال ═══
  http: ^1.6.0

  # ═══ الملفات والصور ═══
  file_picker: ^12.0.0
  flutter_image_compress: ^2.5.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.7

  # ═══ الإشعارات (FCM) ═══
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # ═══ إضافات ═══
  flutter_svg: ^2.3.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/brand/
    - assets/images/brand/promo/
    - assets/translations/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        # 400 و 700 كانا ناقصين، فيُصطنع الخط عند w600/w700.
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  # رمز G1 الرسمي على خلفية Navy.
  image_path: "assets/launcher/icon.png"
  adaptive_icon_background: "#0B1E44"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/launcher/icon.png"
    background_color: "#0B1E44"
    theme_color: "#0B1E44"